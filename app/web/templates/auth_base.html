<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lead Finder{% endblock %}</title>
  <script>
    (() => {
      const saved = localStorage.getItem("theme");
      const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('web.static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <main class="auth-page">
    <div class="brand justify-content-center mb-4">
      <span class="brand-mark"><i class="bi bi-geo-alt-fill"></i></span>
      <span>Lead Finder</span>
    </div>
    <div class="card auth-card">
      <div class="card-body p-4">{% block content %}{% endblock %}</div>
    </div>
  </main>
</body>
</html>
